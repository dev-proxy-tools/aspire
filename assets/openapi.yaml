openapi: 3.0.3
info:
  title: Dev Proxy Management API
  version: 1.0.0
  description: HTTP API exposed by Dev Proxy for inspecting and controlling the proxy process.
servers:
  - url: http://localhost:8897
    description: Default local management API endpoint
security:
  - bearerAuth: []
paths:
  /proxy:
    get:
      operationId: getProxy
      summary: Get proxy state
      responses:
        '200':
          description: Current proxy state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: setProxy
      summary: Update proxy state
      description: Set recording to true to start recording or false to stop recording. ConfigFile cannot be updated through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyUpdate'
      responses:
        '200':
          description: Updated proxy state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyInfo'
        '400':
          description: Invalid proxy state update.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /proxy/mockRequest:
    post:
      operationId: raiseMockRequest
      summary: Raise a mock request
      responses:
        '204':
          description: Mock request raised.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /proxy/stopProxy:
    post:
      operationId: stopProxy
      summary: Stop Dev Proxy
      responses:
        '202':
          description: Proxy shutdown was requested.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /proxy/jwtToken:
    post:
      operationId: createJwtToken
      summary: Create a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JwtOptions'
      responses:
        '200':
          description: Generated JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtInfo'
        '400':
          description: Invalid JWT options.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /proxy/rootCertificate:
    get:
      operationId: getRootCertificate
      summary: Download the root certificate
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [crt]
      responses:
        '200':
          description: Root certificate encoded as PEM.
          content:
            application/x-x509-ca-cert:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        '400':
          description: Missing or unsupported certificate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /proxy/logs:
    get:
      operationId: getLogs
      summary: Read or follow logs
      description: Available only when Dev Proxy runs in detached mode. Set follow=true or accept text/event-stream to stream server-sent events.
      parameters:
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: since
          in: query
          required: false
          description: Optional time or duration filter understood by Dev Proxy.
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum: [text/plain, application/json, text/event-stream]
      responses:
        '200':
          description: Log lines, JSON log entries, or a server-sent event stream.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
            text/event-stream:
              schema:
                type: string
        '404':
          description: Logs are unavailable outside detached mode or the log file does not exist.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-instance token returned by `devproxy api token`.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
  schemas:
    ProxyInfo:
      type: object
      properties:
        recording:
          type: boolean
          nullable: true
        configFile:
          type: string
          nullable: true
    ProxyUpdate:
      type: object
      properties:
        recording:
          type: boolean
          nullable: true
    JwtOptions:
      type: object
      properties:
        audiences:
          type: array
          items:
            type: string
        claims:
          type: object
          additionalProperties:
            type: string
        issuer:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        signingKey:
          type: string
          minLength: 32
          nullable: true
        validFor:
          type: number
          format: double
          nullable: true
    JwtInfo:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogEntry:
      type: object
      properties:
        time:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        raw:
          type: string
          nullable: true
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true